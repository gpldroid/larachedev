name: Apply PWA and customer guide
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          head='<meta name="theme-color" content="#0f172a">'
          additions='''<link rel="icon" href="/dev-v2/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/dev-v2/favicon.svg"><link rel="manifest" href="/dev-v2/manifest.webmanifest">'''
          if 'manifest.webmanifest' not in s:
              s=s.replace(head,head+additions,1)
          guide='''<section id="guide" class="page py-20"><div class="max-w-6xl mx-auto px-4 sm:px-6"><div class="text-center"><span class="text-blue-500 font-black">دليل العميل</span><h2 class="text-3xl md:text-5xl font-black mt-2">كيف تتعامل مع الموقع وتطلب خدمتك؟</h2><p class="mt-4 text-slate-500">خطوات بسيطة تساعدك على الانتقال من التعرف على الخدمة إلى إرسال طلب مشروع واضح.</p></div><div class="grid md:grid-cols-2 lg:grid-cols-4 gap-5 mt-12"><article class="reveal p-6 rounded-3xl bg-white dark:bg-slate-900 border"><b class="text-blue-600 text-xl">01</b><h3 class="font-black text-xl mt-3">استعرض الخدمات</h3><p class="mt-3 text-sm leading-8 text-slate-500">تعرف على خدمات المواقع والمتاجر وصفحات الهبوط وSEO والأداء والصيانة.</p></article><article class="reveal p-6 rounded-3xl bg-white dark:bg-slate-900 border"><b class="text-blue-600 text-xl">02</b><h3 class="font-black text-xl mt-3">حدد احتياجك</h3><p class="mt-3 text-sm leading-8 text-slate-500">حدد نوع المشروع والهدف والصفحات والميزات التي تريدها، حتى لو لم تكن لديك معرفة تقنية.</p></article><article class="reveal p-6 rounded-3xl bg-white dark:bg-slate-900 border"><b class="text-blue-600 text-xl">03</b><h3 class="font-black text-xl mt-3">أرسل التفاصيل</h3><p class="mt-3 text-sm leading-8 text-slate-500">استخدم نموذج التواصل واكتب نشاطك، المطلوب، الجمهور، والوظائف الأساسية التي تحتاجها.</p></article><article class="reveal p-6 rounded-3xl bg-white dark:bg-slate-900 border"><b class="text-blue-600 text-xl">04</b><h3 class="font-black text-xl mt-3">ابدأ التواصل</h3><p class="mt-3 text-sm leading-8 text-slate-500">يمكنك المتابعة عبر واتساب أو البريد لمناقشة المتطلبات قبل بدء التنفيذ.</p></article></div><div class="mt-8 p-7 rounded-3xl bg-blue-50 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900"><h3 class="text-xl font-black">ماذا يجب أن يرسل الزبون؟</h3><p class="mt-3 leading-8 text-slate-600 dark:text-slate-300">يفضل إرسال اسم المشروع أو النشاط، نوع الموقع، عدد الصفحات التقريبي، الخدمات أو المنتجات، المزايا المطلوبة، وأي أمثلة أو مواقع مرجعية. لا ترسل كلمات المرور أو بيانات البطاقات البنكية عبر نموذج التواصل.</p></div></div></section>'''
          marker='</main>'
          if 'id="guide"' not in s:
              s=s.replace(marker,guide+marker,1)
          nav='''<a href="/dev-v2/instructions.html" class="font-bold">دليل التعامل مع الموقع</a>'''
          footer_marker='<div class="flex gap-5 text-sm">'
          if 'instructions.html' not in s:
              s=s.replace(footer_marker,footer_marker+nav,1)
          s=s.replace('<a href="#contact" data-page="contact">اتصل بنا</a>','<a href="#guide" data-page="guide">دليل العميل</a><a href="#contact" data-page="contact">اتصل بنا</a>')
          s=s.replace('class="float-wa w-14 h-14 rounded-full bg-green-500 text-white flex items-center justify-center text-2xl shadow-xl">⌕</a>','class="float-wa w-14 h-14 rounded-full bg-green-500 text-white flex items-center justify-center text-2xl shadow-xl"><i class="fa-brands fa-whatsapp"></i></a>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Optimize logo image
        run: |
          python3 -m pip install --disable-pip-version-check --no-input Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path('assets/LARACHE LOGO.webp')
          if src.exists():
              with Image.open(src) as img:
                  img = img.convert('RGBA')
                  img.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                  tmp = src.with_suffix('.optimized.webp')
                  img.save(tmp, 'WEBP', quality=82, method=6)
              tmp.replace(src)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html "assets/LARACHE LOGO.webp"
          git diff --cached --quiet || git commit -m 'feat: enable PWA icon and add customer guide'
          git push
